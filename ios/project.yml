name: SundayDrive
options:
  bundleIdPrefix: app.sundaydrive
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  SundayDrive:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Sunday Drive
        # The version and build come from the two build settings below, rather
        # than XcodeGen's literal defaults (1.0 and 1). Those literals ignored
        # MARKETING_VERSION and CURRENT_PROJECT_VERSION entirely: every build
        # shipped as 1.0 (1), and every August drive trace recorded "app": "1.0"
        # while this file said 0.1. App Store Connect refuses a second upload
        # with the same build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The wagon on dark paper, because the first screen is dark unless the
        # driver has switched on Match system appearance. Both come from
        # ios/scripts/generate_icon.py. UIImageRespectsSafeAreaInsets keeps the
        # logo centred on the visible area rather than under the island.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Shown with the first request for location, which usually comes while
        # planning, not driving, so it names every use (App Review 5.1.1(ii)) and
        # not the app, which iOS already puts in the alert's title. The privacy
        # page quotes it word for word; tests/test_privacy_page.py checks that.
        NSLocationWhenInUseUsageDescription: "Your location is used to plan drives from where you are, to check that you’re in New England, and to guide you turn by turn."
        # Shown when Precise Location is off and a drive asks for it anyway
        # (`LocationManager.precisePurposeKey`). The key has to match exactly: a
        # purpose CoreLocation cannot find here shows no prompt and says nothing.
        # Here and not in Generated/Info.plist, which `xcodegen generate`
        # overwrites.
        NSLocationTemporaryUsageDescriptionDictionary:
          Navigation: "Turn-by-turn guidance needs your precise location to follow the route."
        # Keep receiving location while backgrounded. With when-in-use
        # authorization this is allowed for navigation as long as the blue
        # status bar indicator is showing, which LocationManager opts into.
        #
        # Without it, a locked phone or an incoming call silently ends the drive:
        # steps stop advancing, arrival never fires, and — since the recorder
        # runs on the same fix stream — half the drive trace goes missing. That
        # is the difference between one test drive and two.
        #
        # `audio` is here for spoken guidance, and it is not optional: measured
        # on the phone on 2026-08-30, a build declaring only `location` failed
        # to speak on all 19 attempts made from the background —
        # `AVAudioSession.setActive(true)` throwing `'!pla'`
        # (`CannotStartPlaying`) with `didStart` never firing — while the same
        # binary with `audio` added spoke 23 of 23, 16 of them with the screen
        # off. The app was demonstrably awake for all 19: fixes kept arriving
        # and every attempt ran. What was refused was the audio session alone.
        #
        # Note that a *simulator* reports the opposite, cheerfully and
        # consistently: it does not enforce this at all. See
        # `docs/voice-guidance-plan.md` §1.
        UIBackgroundModes:
          - location
          - audio
        # Expose Documents/ (where DriveTrace writes each drive) to Files.app and
        # to Finder over a cable. That is the whole export story for drive
        # traces: copy them off, delete the ones you don't want, no in-app UI
        # and no upload. They're a record of where you drove, so they stay on
        # the phone until you move them yourself.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Allow http to the local Flask dev server (simulator -> host). The
        # deployed backend is https, so it needs no exception of its own.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The deployed backend, baked into the bundle. This has to live in
        # Info.plist rather than the scheme: a scheme environment variable only
        # exists while Xcode owns the process, so an app launched from the home
        # screen (or relaunched by iOS after being jettisoned mid-drive) would
        # otherwise fall back to localhost and fail every request.
        # RouteService still prefers SUNDAYDRIVE_API when it is set, for local work.
        SundayDriveAPIBaseURL: https://api.jameskouvlis.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sundaydrive
        # Here rather than picked in Xcode, because SundayDrive.xcodeproj is a
        # gitignored build output: every `xcodegen generate` rewrites it, and a
        # team set through the UI is wiped each time. That regeneration is not
        # optional — a pull brings new Swift files and never the project that
        # lists them, so adding a source file and forgetting to regenerate is
        # "Cannot find type X in scope" with the file plainly on disk.
        DEVELOPMENT_TEAM: 28ZU5P5GC3
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # No scheme environment variables on purpose: the app reads its backend from
    # SundayDriveAPIBaseURL above, so a build behaves the same whether Xcode launched
    # it or the user tapped the icon. To develop against a local server, add
    # SUNDAYDRIVE_API to the Run action's environment in Xcode's scheme editor —
    # http://127.0.0.1:5057 in the simulator, or http://<your-mac>.local:5057
    # for a device on the same Wi-Fi.

  # Unit tests for the logic that a simulator cannot exercise and a drive can
  # only test once: where the driver is on the route, when a maneuver has been
  # passed, when the trip has actually ended, and which of two overlapping
  # reroutes wins. `NavigationModel.fetchRoute` is the seam that lets these run
  # with no backend.
  SundayDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: SundayDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sundaydrive.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SundayDrive:
    build:
      targets:
        SundayDrive: all
        SundayDriveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SundayDriveTests
