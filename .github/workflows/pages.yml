# Publishes site/ — and only site/ — to GitHub Pages.
#
# Do NOT switch Pages to "Deploy from a branch" with /docs: that would publish
# every internal document in docs/ as a public page. The privacy policy lives
# in site/ so that this workflow can upload that one folder and nothing else.
# See §4 of the Pages brief, `git show a2ddddc:docs/privacy-policy-page-brief.md`.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
